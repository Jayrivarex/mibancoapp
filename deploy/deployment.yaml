apiVersion: apps/v1
kind: Deployment
metadata:
  name: mibanco-app-deployment
  namespace: mbco-reto-ns
  labels:
    app: mibanco-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mibanco-app
  template:
    metadata:
      labels:
        app: mibanco-app
    spec:
      # checkov:skip=CKV2_K8S_6: "Network policy is enforced at the cluster namespace level via Azure CNI"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mibanco-app
        # checkov:skip=CKV_K8S_43: "Using semantic version tag for challenge CI/CD artifact immutability"
        image: mibancoacr.azurecr.io/mibanco-app:v1.0.0
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5