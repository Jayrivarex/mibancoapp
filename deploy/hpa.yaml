apiVersion: autoscaling/v2
kind: Autoscaler # o HorizontalPodAutoscaler
kind: HorizontalPodAutoscaler
metadata:
  name: mibanco-app-hpa
  namespace: mbco-reto-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mibanco-app-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70