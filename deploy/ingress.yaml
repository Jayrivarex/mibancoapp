apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mibanco-ingress
  namespace: mbco-reto-ns
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: mibanco-reto.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mibanco-app-service
            port:
              number: 80